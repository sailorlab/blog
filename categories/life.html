---
layout: page
title: 关于生活
permalink: /categories/life/
---
<style>
/* 让page布局自带的标题居中 */
h1.page-title {
  text-align: center;
}
</style>
{% assign posts = site.posts | where_exp:"item","item.category == 'life'" %}

<div class="container">
<div class="home-intro">
<p>生活随笔与日常记录</p>
</div>
<div class="posts-timeline">
    {% for post in posts %}
    <div class="post-item">
        <h2>
            <time>{{ post.date | date:"%Y-%m-%d" }}</time> &nbsp;
            <a href="{{ post.url }}">{{ post.title }}</a>
        </h2>
        <hr>
    </div>
    {% endfor %}
</div>
</div>
