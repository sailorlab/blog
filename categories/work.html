---
layout: default
title: 工作及其他
permalink: /categories/work/
---
<style>
/* 本页面独有样式：作品卡片 + 图片弹窗灯箱 */
.works-grid{
display: grid;
grid-template-columns: repeat(2,1fr);
gap:30px;
width:100%;
}
.work-card{
cursor: pointer;
position: relative; /* 给播放角标做定位容器 */
}
.work-card-thumb{
width:100%;
aspect-ratio:16 / 9;
object-fit:cover;
border-radius:4px;
transition:0.24s;
}
.work-card:hover .work-card-thumb{
transform: translateY(-4px);
}
.work-card-info{
margin-top:12px;
}
.work-title{
font-size:16px;
font-weight:500;
color:#222;
}
.work-desc{
font-size:13px;
color:#777;
margin-top:4px;
}
/* 视频播放角标，增加hover联动放大动画 */
.play-badge{
position:absolute;
bottom:10px;
right:10px;
width:36px;
height:36px;
background:rgba(0,0,0,0.55);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:16px;
transition:0.24s ease;
}
.play-badge::after{
content:"▶";
margin-left:2px;
}
.work-card:hover .play-badge{
transform: scale(1.15);
background:rgba(0,0,0,0.7);
}
/* 图片弹窗灯箱 */
.lightbox-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.88);
z-index:9999;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}
.lightbox-overlay.show{
display:flex;
}
.lightbox-wrap{
position:relative;
max-width:90vw;
max-height:90vh;
}
.lightbox-media{
max-width:90vw;
max-height:85vh;
object-fit:contain;
border-radius:4px;
}
.lightbox-close{
position:absolute;
top:-40px;
right:0;
color:#fff;
font-size:28px;
cursor:pointer;
}
.lightbox-prev, .lightbox-next{
position:absolute;
top:50%;
transform:translateY(-50%);
color:#fff;
font-size:36px;
background:transparent;
border:none;
cursor:pointer;
padding:0 12px;
}
.lightbox-prev{
left:-50px;
}
.lightbox-next{
right:-50px;
}
.lightbox-index-text{
color:#fff;
text-align:center;
margin-top:12px;
font-size:14px;
}
@media(max-width:768px){
.works-grid{
grid-template-columns:1fr;
  }
.lightbox-prev,.lightbox-next{
left:0;
right:0;
  }
.play-badge{
width:32px;
height:32px;
font-size:14px;
}
}
</style>
<div class="container">
<div class="home-intro">
<div class="home-intro-inner">
<h1>工作及其他</h1>
<p>Case Collection 作品总数：{{ site.data.works.size }}</p>
</div>
</div>
<!-- 调试信息，永久保留，方便维护 -->
<div class="works-grid">
{% for item in site.data.works %}
<div class="work-card"
data-work-id="{{item.id}}"
data-media-count="{{item.media_count}}"
data-ext="{{item.ext}}"
data-media-type="{{item.media_type}}">
<img class="work-card-thumb"
src="{{ site.baseurl }}/assets/images/works/{{item.id}}/1.jpg"
alt="{{ item.title }}">
{% if item.media_type == 'video' %}
<div class="play-badge"></div>
{% endif %}
<div class="work-card-info">
<div class="work-title">{{ item.title }}</div>
<div class="work-desc">{{ item.desc }}</div>
</div>
</div>
{% endfor %}
</div>
</div>
<!-- 灯箱弹窗DOM，把img替换成容器lightbox-media -->
<div class="lightbox-overlay" id="lightbox">
<div class="lightbox-wrap">
<div class="lightbox-close" id="lbClose">×</div>
<button class="lightbox-prev" id="lbPrev">‹</button>
<div class="lightbox-media" id="lbMedia"></div>
<button class="lightbox-next" id="lbNext">›</button>
<div class="lightbox-index-text" id="lbIndex"></div>
</div>
</div>
<script>
const lightbox = document.getElementById('lightbox');
const lbMedia = document.getElementById('lbMedia');
const lbClose = document.getElementById('lbClose');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
const lbIndex = document.getElementById('lbIndex');
let currentWorkId = null;
let totalMedia = 0;
let currentIndex = 0;
let mediaExt = "";
let mediaType = "";
const basePath = "{{ site.baseurl }}/assets/images/works/";

// 打开弹窗
document.querySelectorAll('.work-card').forEach(card=>{
card.addEventListener('click',()=>{
currentWorkId = Number(card.dataset.workId);
totalMedia = Number(card.dataset.mediaCount);
mediaExt = card.dataset.ext;
mediaType = card.dataset.mediaType;
currentIndex = 1;
renderLightbox();
lightbox.classList.add('show');
  })
})

function renderLightbox(){
  const src = `${basePath}${currentWorkId}/${currentIndex}.${mediaExt}`;
  if(mediaType === 'video'){
    lbMedia.innerHTML = `<video class="lightbox-media" controls preload="metadata" playsinline src="${src}"></video>`;
  }else{
    lbMedia.innerHTML = `<img class="lightbox-media" src="${src}" alt="">`;
  }
  lbIndex.textContent = `${currentIndex} / ${totalMedia}`;
}

// 关闭弹窗
lbClose.addEventListener('click', ()=>{
lightbox.classList.remove('show');
// 关闭时暂停视频，防止后台继续播放
lbMedia.innerHTML = '';
})
lightbox.addEventListener('click',(e)=>{
if(e.target === lightbox){
lightbox.classList.remove('show');
lbMedia.innerHTML = '';
  }
})

// 上一张
lbPrev.addEventListener('click',()=>{
if(currentIndex >1){
currentIndex--;
renderLightbox();
  }
})
// 下一张
lbNext.addEventListener('click',()=>{
if(currentIndex < totalMedia){
currentIndex++;
renderLightbox();
  }
})

// 键盘左右箭头、ESC关闭
document.addEventListener('keydown',(e)=>{
if(!lightbox.classList.contains('show')) return;
if(e.key === 'Escape'){
lightbox.classList.remove('show');
lbMedia.innerHTML = '';
  }
if(e.key === 'ArrowLeft'){
if(currentIndex>1) {
currentIndex--;
renderLightbox();
    }
  }
if(e.key === 'ArrowRight'){
if(currentIndex < totalMedia) {
currentIndex++;
renderLightbox();
    }
  }
})
</script>
