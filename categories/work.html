---
layout: page
title: 工作及其他
permalink: /categories/work/
---
<style>
h1:first-of-type {
  display: none;
}
</style>
{% assign posts = site.posts | where_exp:"item","item.category == 'work'" %}

<div class="container">
<div class="home-intro">
<p>工作项目、思考记录</p>
</div>
<div class="posts-timeline">
    {% for post in posts %}
    <div class="post-item">
        <h2>
            <time>{{ post.date | date:"%Y-%m-%d" }}</time> &nbsp;
            <a href="{{ post.url }}">{{ post.title }}</a>
        </h2>
    </div>
    {% endfor %}
</div>
</div>
