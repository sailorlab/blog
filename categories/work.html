---
layout: default
title: 工作及其他
permalink: /categories/work/
---
<div class="container">
<div class="home-intro">
<p>项目记录、设计思考与工作随笔</p>
</div>
  {% assign posts = site.posts | where_exp:"item","item.category == 'work'" %}
  {% for post in posts %}
<div class="post-card">
<img class="post-card-thumb" src="{{ site.baseurl }}{{ post.thumbnail }}" alt="{{ post.title }}">
<div class="post-card-text">
<div class="post-card-date">{{ post.date | date: "%Y-%m-%d" }}</div>
<a class="post-card-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
</div>
</div>
  {% endfor %}
</div>
