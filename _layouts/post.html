---
layout: default
---
<style>
.post-wrap {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap:48px;
  padding:40px 0;
}
.post-sidebar {
  border-right: 1px solid #eee;
  padding-right:24px;
}
.post-content h1 {
  font-size:48px;
  margin:0 0 32px;
}
.post-content p {
  font-size:18px;
  line-height:1.8;
}
.post-content img {
  max-width:100%;
  height:auto;
  margin:16px 0;
}
.back-link {
  display:inline-block;
  margin-bottom:32px;
  color:#555;
  text-decoration:none;
}
.back-link:hover {
  text-decoration:underline;
}
.meta-line {
  margin:16px 0;
  color:#666;
}
.tag-item {
  display:inline-block;
  margin:4px 4px 4px 0;
  color:#444;
  text-decoration:none;
}
/* 移动端自动变成上下堆叠 */
@media (max-width:768px){
  .post-wrap {
    grid-template-columns: 1fr;
    gap:24px;
  }
  .post-sidebar {
    border-right:none;
    border-bottom:1px solid #eee;
    padding-bottom:24px;
    padding-right:0;
  }
}
</style>

<div class="container">
  <div class="post-wrap">
    <aside class="post-sidebar">
      <a class="back-link" href="{{ site.baseurl }}/tags/">← 所有文章</a>
      <div class="meta-line">发布于</div>
      <div class="meta-line">{{ page.date | date:"%Y年%m月%d日" }}</div>
      <div class="meta-line">标签</div>
      <div>
        {% for tag in page.tags %}
          <a class="tag-item" href="{{ site.baseurl }}/tags/#">{{ tag }}</a>
        {% endfor %}
      </div>
    </aside>
    <article class="post-content">
      <h1>{{ page.title }}</h1>
      {{ content }}
    </article>
  </div>
</div>
