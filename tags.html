---
layout: default
---
<style>
/* 沿用和首页统一的容器排版 */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}
.home-intro {
  margin-bottom:60px;
}
.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap:16px;
  margin-top:24px;
}
.tag-item {
  font-size:18px;
  padding:8px 16px;
  border:1px solid #ddd;
  border-radius:6px;
  text-decoration: none;
  color:#333;
  transition:0.2s;
}
.tag-item:hover {
  background:#222;
  color:#fff;
  border-color:#222;
}
</style>

<div class="container">
<div class="home-intro">
  <h1>标签集合</h1>
  <p>按标签浏览全部文章</p>
</div>

<div class="tag-cloud">
{% for tag in site.tags %}
  <a class="tag-item" href="{{ site.baseurl }}/tags/{{ tag[0] }}/">{{ tag[0] }} <span style="color:#888;">({{ tag[1].size }})</span></a>
{% endfor %}
</div>
</div>
