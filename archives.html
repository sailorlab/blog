---
layout: default
title: 文章归档
permalink: /archives/
---
<style>
/* 统一container最大宽度 1100px */
.container {
max-width: 1100px;
margin: 0 auto;
padding: 0 20px;
width: 100%;
box-sizing: border-box;
}
.home-intro {
margin-bottom:60px;
}
.home-intro h1 {
font-size:32px;
margin:0 0 8px 0;
font-weight:600;
}
.home-intro p {
color:#666;
font-size:16px;
margin:0;
}
/* 和首页完全一致的两列网格 */
.post-list {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap:30px;
}
.post-card {
display: flex;
justify-content: space-between;
align-items: flex-start;
padding:40px 0;
border-bottom:1px solid #e5e5e5;
transition: all 0.24s ease;
}
.post-card:hover {
transform: translateY(-2px);
}
.post-card-thumb {
width:140px;
height:100px;
object-fit: cover;
border-radius:4px;
flex-shrink:0;
}
.post-card-text {
text-align:right;
flex:1;
padding-left:20px;
}
.post-card-date {
font-size:12px;
color:#777;
margin-bottom:8px;
}
.post-card-title {
font-size:18px;
font-weight:500;
color:#222;
text-decoration:none;
display:block;
}
.post-card-title:hover {
color:#000;
text-decoration:none;
}
/* 移动端自动单列 */
@media (max-width:768px) {
.post-list {
grid-template-columns:1fr;
}
}
@media (max-width:640px) {
.post-card {
flex-direction:column;
}
.post-card-thumb {
width:100%;
height:180px;
margin-bottom:12px;
}
.post-card-text {
text-align:left;
padding-left:0;
}
}
</style>
<div class="container">
<div class="home-intro">
<h1>文章归档</h1>
<p>全部文章归档列表</p>
</div>

<div class="post-list">
{% for post in site.posts %}
<div class="post-card">
<img class="post-card-thumb" src="{{ site.baseurl }}{{ post.thumbnail }}" alt="{{ post.title }}">
<div class="post-card-text">
<div class="post-card-date">{{ post.date | date: "%Y-%m-%d" }}</div>
<a class="post-card-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
{% if post.tags.size > 0 %}
<div style="margin-top:8px;font-size:12px;color:#888;">
{% for tag in post.tags %}
#{{ tag }}
{% endfor %}
</div>
{% endif %}
</div>
</div>
{% endfor %}
</div>
</div>
